[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-api"
version = "0.1.0"
description = "股市量化平台 REST API（阶段 1：MACD 指标）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.0",
    "httpx>=0.27",
    "stock-indicators",
    "stock-datasource",
    "stock-market",
    "stock-strategies",
    "stock-backtest",
    "stock-scheduler",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# src 布局：main.py 作为顶层模块，其余子目录作为顶层包
[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
