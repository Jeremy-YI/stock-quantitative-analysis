# ============================================================
# nginx.conf —— 反向代理网关配置
#
# nginx 是什么？一个高性能的 Web 服务器 / 反向代理。
# 在本项目里它扮演「唯一大门」的角色：浏览器只访问它(80 端口)，
# 由它根据路径把请求转发给后面的 api 或 web，好处：
#   1) 端口收口：对外只开 80，内部 8000/3000 不暴露
#   2) 反向代理：前端页面里写 /api/xxx 即可，不用写 http://后端IP:8000
#   3) 同源访问：页面和接口都从同一个域名(端口)出去，天然无跨域问题
# ============================================================

# upstream = 上游服务器组：给后面 proxy_pass 一个「名字」，指到具体服务
upstream api_upstream {
    # docker-compose 里 api 服务的容器名就是 host 名，端口是内部 8000
    server api:8000;
}

upstream web_upstream {
    server web:3000;
}

server {
    # 监听 80 端口（HTTP 默认端口）
    listen 80;
    # 服务名，本地/局域网访问都匹配；生产可换成你的域名
    server_name _;

    # 请求体大小上限（阶段 1 用不到，先给个合理值）
    client_max_body_size 10m;

    # 后端接口：/api/ 开头 → 转发给 FastAPI
    location /api/ {
        proxy_pass http://api_upstream;
        # 把原始请求头透传给后端（Host / 客户端 IP / 协议等）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余请求 → 转发给 Next.js 前端
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / 热更新（Next.js dev 需要，生产无副作用）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
