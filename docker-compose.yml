# ============================================================
# docker-compose.yml —— 用一条命令把整套服务（数据库/后端/前端/网关）都拉起来
#
# 什么是 docker-compose？
#   它是一个「编排工具」：把你需要的多个容器（一个容器 ≈ 一个隔离的小虚拟机）
#   定义在这个文件里，然后 `docker compose up` 一次性全部启动，
#   并且自动帮它们连到同一个内部网络、互相能通过服务名访问。
#
# 每个 service 的注释都会解释：它是谁、干什么、为什么需要它。
# ============================================================

services:
  # ----------------------------------------------------------
  # MySQL 8：数据库，阶段 2 用来存日线数据(daily_bars)和指标缓存(indicator_cache)
  # 阶段 1 API 暂不依赖它，但先把它在本地跑起来，schema 见 apps/api/migrations/
  # ----------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: stock-mysql
    restart: unless-stopped
    environment:
      # root 密码 —— 仅本地开发用，生产环境务必改掉并通过环境变量注入
      MYSQL_ROOT_PASSWORD: root
      # 自动创建的数据库名，和 migrations/0001_init.sql 里保持一致
      MYSQL_DATABASE: stock_platform
      MYSQL_USER: stock
      MYSQL_PASSWORD: stock
    ports:
      # 把容器内的 3306 端口映射到宿主机 3306，方便用本机客户端连
      - "3306:3306"
    volumes:
      # 数据卷：让 MySQL 的数据落盘到宿主机，容器删了数据还在
      - mysql-data:/var/lib/mysql
      # 首次启动时自动执行目录里的 SQL 脚本（按文件名顺序）
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 健康检查：MySQL 没就绪前，依赖它的服务不会提前启动
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------
  # api：FastAPI 后端，处理 /api/v1/** 请求
  # ----------------------------------------------------------
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: stock-api
    restart: unless-stopped
    environment:
      # 容器里没有「~/Desktop」这个路径，所以把宿主机数据目录挂载后，
      # 用这个环境变量告诉后端去哪里读 hsjday 文件
      STOCK_HSJDAY_ROOT: /data/hsjday
    volumes:
      # 把宿主机（你 Mac）的 hsjday 数据只读挂进容器，后端能直接读
      - ~/Desktop/每日复盘/hsjday:/data/hsjday:ro
    expose:
      # 只对内部网络暴露 8000 端口（不直接对外），统一由 nginx 收口
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy

  # ----------------------------------------------------------
  # web：Next.js 前端，渲染页面（React 服务端渲染 + ECharts 图表）
  # ----------------------------------------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: stock-web
    restart: unless-stopped
    # 把 Next.js 默认端口 3000 只暴露给内部网络，对外由 nginx 收口
    expose:
      - "3000"
    depends_on:
      - api

  # ----------------------------------------------------------
  # nginx：反向代理网关（唯一对外入口）
  # 作用：把所有请求统一从 80 端口收进来，再按路径转发——
  #   /api/**  → 转给 api 服务
  #   其他     → 转给 web 服务
  # 好处：前端不用关心后端在哪，跨域问题也被一并解决（同源访问）
  # ----------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: stock-nginx
    restart: unless-stopped
    ports:
      # 宿主机 80 端口 → 容器 80 端口，浏览器访问 http://localhost 即可
      - "80:80"
    volumes:
      # 把我们写的 nginx.conf 挂进去，覆盖 nginx 默认配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

# 顶层 volumes：声明上面用到的命名数据卷
volumes:
  mysql-data:
